<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>atom 安装</title>
<style>
/* Same palette, radii and type as the atom panel (atomdns/webui/src/style.css). */
:root{
  --bg:#f4f4f6;--card:#ffffff;--fill:#f0f0f3;--fill2:#e7e7ec;--line:#e4e4ea;
  --text:#1b1b22;--muted:#7c7c88;--faint:#a3a3ad;--accent:#2f7cf6;--accent-soft:#e3eeff;--on-accent:#ffffff;
  --ok:#1f9d55;--ok-soft:#e2f5ea;--warn:#c98a12;--warn-soft:#fbf1dc;--bad:#e0484e;--bad-soft:#fde6e7;
  --lan:#2f7cf6;--lan-soft:#e3eeff;--wan:#8b5cf6;--wan-soft:#efe8ff;
  --sel:#2b2d36;--on-sel:#ffffff;--log:#16171c;--log-ink:#c9cbd6;--shadow:0 1px 2px #0000000d,0 8px 28px #00000010;
  --r-card:22px;--r-ctl:12px;--r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f12;--card:#191a1f;--fill:#22232a;--fill2:#2b2c34;--line:#2c2d35;
  --text:#ececf1;--muted:#9a9aa6;--faint:#6d6d79;--accent:#5b9bff;--accent-soft:#1d2c46;--on-accent:#0b1220;
  --ok:#3fc27a;--ok-soft:#173326;--warn:#e8b44a;--warn-soft:#3a2f17;--bad:#ff6b70;--bad-soft:#3d1d20;
  --lan:#5b9bff;--lan-soft:#1d2c46;--wan:#a78bfa;--wan-soft:#2a2142;
  --sel:#e9e9ef;--on-sel:#15161b;--log:#0b0c0f;--log-ink:#b9bcc8;--shadow:0 1px 2px #00000040,0 8px 28px #00000040;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12;--card:#191a1f;--fill:#22232a;--fill2:#2b2c34;--line:#2c2d35;
  --text:#ececf1;--muted:#9a9aa6;--faint:#6d6d79;--accent:#5b9bff;--accent-soft:#1d2c46;--on-accent:#0b1220;
  --ok:#3fc27a;--ok-soft:#173326;--warn:#e8b44a;--warn-soft:#3a2f17;--bad:#ff6b70;--bad-soft:#3d1d20;
  --lan:#5b9bff;--lan-soft:#1d2c46;--wan:#a78bfa;--wan-soft:#2a2142;
  --sel:#e9e9ef;--on-sel:#15161b;--log:#0b0c0f;--log-ink:#b9bcc8;--shadow:0 1px 2px #00000040,0 8px 28px #00000040;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}

.page{min-height:100vh;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.frame{width:100%;max-width:1000px;display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:clip;min-height:620px}

/* left rail */
.rail{background:var(--fill);padding:28px 22px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--card);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand .n{font-size:17px;line-height:1.2}
.brand .v{font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:22px;color:var(--muted)}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13.25px;top:31px;bottom:1px;width:1.5px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--ok)}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.steps li .t{padding-top:3px}
.steps li.on{color:var(--text)}
.steps li.on .dot{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.steps li.done .dot{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.dot svg{width:14px;height:14px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* content */
.body{display:flex;flex-direction:column;min-width:0}
.mbar{display:none}
.content{flex:1;padding:36px 40px 24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.head .k{font-size:12.5px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.head h1{font-size:24px;font-weight:500;margin:0;letter-spacing:-.01em}
.navbar{display:flex;align-items:center;gap:10px;padding:16px 40px 24px;position:sticky;bottom:0;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(8px);border-bottom-right-radius:28px}
.navbar .sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:9px 20px;white-space:nowrap;cursor:pointer;text-decoration:none;color:inherit}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.lg{padding:11px 26px;font-size:15px}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--fill);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}

/* check list */
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--fill)}
.check .grow{flex:1;min-width:0}
.check .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge svg{width:16px;height:16px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.wait{background:var(--fill2);color:var(--muted)}
.badge.run{background:var(--accent-soft);color:var(--accent)}

/* fields */
.sec{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12.5px;color:var(--muted)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.bad{border-color:var(--bad)}
textarea.inp{font-family:var(--mono);font-size:12.5px;line-height:1.6;min-height:132px;resize:vertical}
.err{font-size:12.5px;color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.short{max-width:220px}

/* topology cards */
.topos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.topo{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;border:1.5px solid var(--line);cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.topo:hover{border-color:var(--faint)}
.topo.sel{border-color:var(--accent);background:var(--accent-soft)}
.topo input{position:absolute;opacity:0;pointer-events:none}
.topo:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.topo .art{border-radius:12px;background:var(--fill);display:grid;place-items:center;padding:12px 8px}
.topo.sel .art{background:var(--card)}
.topo .art svg{width:100%;max-width:240px;height:auto}
.topo .nm{display:flex;align-items:center;gap:8px;font-size:15px}
.topo .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.topo.sel .tk{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.topo .tk svg{width:11px;height:11px}
.art .ln{stroke:var(--faint);stroke-width:1.6;fill:none}
.art .hot{stroke:var(--accent);stroke-width:1.8;fill:none}
.art .lan{stroke:var(--lan);stroke-width:2;fill:none}
.art .wan{stroke:var(--wan);stroke-width:2;fill:none}
.art .lan-t{fill:var(--lan)}
.art .wan-t{fill:var(--wan)}
.art .box{fill:var(--card);stroke:var(--faint);stroke-width:1.4}
.topo.sel .art .box{fill:var(--fill)}
.art .me{fill:var(--accent)}
.art text{font:11px var(--font);fill:var(--muted)}
.art .me-t{fill:var(--on-accent)}

/* interface picker */
.ifs{display:flex;flex-direction:column;gap:8px}
.if{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer;background:var(--card)}
.if:hover{border-color:var(--faint)}
.if.sel{border-color:var(--accent);background:var(--accent-soft)}
.if input{position:absolute;opacity:0;pointer-events:none}
.if:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.if .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.if .a{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.if .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.if.multi .tk{border-radius:6px}
.if.sel .tk{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.if .tk svg{width:11px;height:11px}
.side{--c:var(--lan);--c-soft:var(--lan-soft);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--fill);border-top:3px solid var(--c)}
.side.wan{--c:var(--wan);--c-soft:var(--wan-soft)}
.side .rt{display:flex;flex-direction:column;gap:12px;padding-top:12px;margin-top:2px;border-top:1px solid var(--line)}
.side .rt textarea.inp{min-height:76px}
.side .sh{display:flex;align-items:center;gap:10px}
.side .sh .ic{width:30px;height:30px;border-radius:10px;background:var(--c-soft);color:var(--c);display:grid;place-items:center;flex:none}
.side .sh .ic svg{width:17px;height:17px}
.side .sh .nm{font-size:15px;color:var(--c)}
.side .sh .tag{margin-left:auto}
.side .if.sel{border-color:var(--c);background:var(--c-soft)}
.side .if.sel .tk{border-color:var(--c);background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:var(--r-pill);background:var(--lan-soft);color:var(--lan);font-family:var(--mono)}
.chip.wan{background:var(--wan-soft);color:var(--wan)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:var(--r-pill);background:var(--fill2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

.alert{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--warn-soft);align-items:flex-start}
.alert svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.alert .grow{flex:1;display:flex;flex-direction:column;gap:10px}
.alert.bad{background:var(--bad-soft)}
.alert.bad svg{color:var(--bad)}
.alert.bad .grow{overflow-wrap:anywhere}
.agree{display:inline-flex;align-items:center;gap:8px;cursor:pointer;align-self:flex-start}
.agree input{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--fill);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:15px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tile.wide{grid-column:1/-1}

/* progress */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:flex;gap:14px;align-items:center;position:relative;padding:7px 0}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:14.25px;top:38px;bottom:-7px;width:1.5px;background:var(--line)}
.timeline li.ok:not(:last-child)::after{background:var(--ok)}
.timeline .t{font-size:15px}
.timeline li.pending .t{color:var(--faint)}
.timeline li.fail .t{color:var(--bad)}
.timeline .badge{position:relative;z-index:1}
.bar{height:6px;border-radius:var(--r-pill);background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.bar.ok i{background:var(--ok)}
.bar.fail i{background:var(--bad)}
details.log{border-radius:14px;background:var(--fill)}
details.log summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:12.5px;list-style:none;display:flex;align-items:center;gap:6px}
details.log summary::-webkit-details-marker{display:none}
details.log summary svg{width:14px;height:14px;transition:transform .15s}
details.log[open] summary svg{transform:rotate(90deg)}
pre.out{margin:0 6px 6px;background:var(--log);color:var(--log-ink);border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}
.warnlist{display:flex;flex-direction:column;gap:4px}

/* done */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.hero .big{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.hero .big svg{width:32px;height:32px}
.hero h1{font-size:24px;font-weight:500;margin:6px 0 0}
.hero .url{font-family:var(--mono);font-size:13px;color:var(--muted)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .check .n{width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12.5px;flex:none;color:var(--muted)}
.val{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;background:var(--card);border-radius:8px;padding:2px 4px 2px 8px;margin:0 2px;vertical-align:1px}
.val button{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.val button:hover{background:var(--fill2);color:var(--text)}
.val button svg{width:13px;height:13px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{display:grid;place-items:center;min-height:320px;color:var(--muted)}

@media (max-width:760px){
  .page{display:block;padding:0}
  .frame{grid-template-columns:1fr;border-radius:0;box-shadow:none;min-height:100vh}
  .rail{display:none}
  .mbar{display:flex;align-items:center;gap:12px;padding:16px 16px 0}
  .mbar .brand .n{font-size:15px}
  .mbar .sp{flex:1}
  .mbar .bar{width:88px}
  .content{padding:22px 16px 16px}
  .navbar{padding:12px 16px calc(20px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
  .g2,.topos,.tiles{grid-template-columns:1fr}
  .short{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1.6s!important}}
</style>
</head>
<body>
<div class="page"><div class="frame" id="app"><div class="boot"><span class="spin"></span></div></div></div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: method === 'GET' ? undefined : { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.error) || ('HTTP ' + r.status)); err.data = data; throw err; }
  return data;
}

const I = {
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(-60 12 12)"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  dot: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>',
};
const spin = '<span class="spin"></span>';
const badge = (kind, icon) => `<span class="badge ${kind}">${icon}</span>`;

// Topology diagrams: the highlighted circle is this machine.
const ART = {
  bypass: `<svg viewBox="0 0 240 92" aria-hidden="true">
    <path class="ln" d="M44 46h52"/><path class="ln" d="M140 46h56"/>
    <path class="hot" d="M120 60v18"/>
    <rect class="box" x="8" y="31" width="36" height="30" rx="8"/><text x="26" y="78" text-anchor="middle">设备</text>
    <rect class="box" x="96" y="31" width="44" height="30" rx="8"/><text x="118" y="24" text-anchor="middle">主路由</text>
    <rect class="box" x="196" y="31" width="36" height="30" rx="8"/><text x="214" y="78" text-anchor="middle">外网</text>
    <circle class="me" cx="120" cy="80" r="11"/><text class="me-t" x="120" y="84" text-anchor="middle">a</text>
  </svg>`,
  gateway: `<svg viewBox="0 0 240 92" aria-hidden="true">
    <path class="ln" d="M44 46h18"/><path class="lan" d="M62 46h36"/><path class="wan" d="M142 46h34"/><path class="ln" d="M176 46h20"/>
    <rect class="box" x="8" y="31" width="36" height="30" rx="8"/><text x="26" y="78" text-anchor="middle">设备</text>
    <circle class="me" cx="120" cy="46" r="18"/><text class="me-t" x="120" y="50" text-anchor="middle">a</text>
    <text class="lan-t" x="80" y="38" text-anchor="middle">LAN</text><text class="wan-t" x="160" y="38" text-anchor="middle">WAN</text>
    <rect class="box" x="196" y="31" width="36" height="30" rx="8"/><text x="214" y="78" text-anchor="middle">外网</text>
  </svg>`,
};

const FIELD_STEP = { topology: 'net', lan: 'net', wan: 'net', accept_gateway: 'net', lan_gateway: 'net', client_nets: 'net', router: 'net', panel_port: 'net', panel_user: 'net', panel_password: 'net', domestic: 'dns', foreign: 'dns', fakeip_range: 'sb', mixed_port: 'sb' };
// the DNS and sing-box steps are skipped when the data of an earlier installation is there: its settings stay
function steps() {
  const all = [{ id: 'env', name: '环境检查', view: viewEnv }, { id: 'net', name: '网络', view: viewNet }, { id: 'dns', name: 'DNS 上游', view: viewDNS },
    { id: 'sb', name: '代理', view: viewSB }, { id: 'confirm', name: '确认', view: viewConfirm }];
  return S.state.has_data ? all.filter(x => x.id !== 'dns' && x.id !== 'sb') : all;
}
function stepId() { return steps()[S.step].id; }
const S = { routesEdited: false, state: null, step: 0, cfg: null, errors: {}, freed: [], freeing: null, freeErr: '', job: null, jobNext: 0, log: [], phase: 'wizard', redirectTimer: null, paused: false, logOpen: false };

function initCfg(st) {
  const ifs = st.ifaces, def = ifs.find(i => i.default) || ifs[0];
  S.cfg = {
    topology: ifs.length >= 2 ? '' : 'bypass',
    lan: def ? [def.name] : [], wan: '', accept_gateway: false, lan_gateway: '', client_nets: '',
    reply_via: false, router: '',
    panel_port: st.defaults.panel_port, panel_user: '', panel_password: '',
    domestic: st.defaults.domestic, foreign: st.defaults.foreign,
    fakeip_range: st.defaults.fakeip_range, mixed_port: st.defaults.mixed_port, nodes: '',
  };
}

async function loadState() {
  S.state = await api('GET', '/api/state');
  if (!S.cfg) initCfg(S.state);
}

function envProblems() { return S.state.system.problems; }
function envReady() { return envProblems().length === 0 && S.state.port53.length === 0; }

const errOf = f => S.errors[f] ? `<div class="err">${esc(S.errors[f])}</div>` : '';
const bad = f => S.errors[f] ? ' bad' : '';

function head(title) {
  const list = steps();
  return `<div class="head"><div class="k">第 ${S.step + 1} 步，共 ${list.length} 步</div><h1>${esc(title)}</h1></div>`;
}

function viewEnv() {
  const st = S.state, sys = st.system;
  const osBad = sys.problems.some(p => /Debian|Ubuntu/.test(p));
  let h = head('环境检查') + '<div class="checks">';
  h += `<div class="check">${badge(osBad ? 'bad' : 'ok', osBad ? I.bad : I.ok)}<div class="grow">系统<div class="s">${esc(sys.os || '未知')} · ${esc(sys.arch)}${sys.hostname ? ' · ' + esc(sys.hostname) : ''}</div></div></div>`;
  sys.problems.forEach(p => { h += `<div class="check">${badge('bad', I.bad)}<div class="grow">${esc(p)}</div></div>`; });
  S.freed.forEach(f => { h += `<div class="check">${badge('ok', I.ok)}<div class="grow">${esc(f)}</div></div>`; });
  if (st.port53.length === 0 && !st.scan_error) {
    h += `<div class="check">${badge('ok', I.ok)}<div class="grow">53 端口空闲</div></div>`;
  }
  if (st.scan_error) h += `<div class="check">${badge('bad', I.bad)}<div class="grow">53 端口检查失败<div class="s">${esc(st.scan_error)}</div></div></div>`;
  st.port53.forEach((o, i) => {
    const what = esc(o.proc || '未知进程') + (o.pid ? ` · PID ${o.pid}` : '');
    let btn = '';
    if (o.kind === 'resolved') btn = `<button class="btn pri sm" data-act="free" data-i="${i}">停用系统 DNS 监听</button>`;
    else if (o.kind === 'unit' || o.kind === 'openrc') btn = `<button class="btn pri sm" data-act="free" data-i="${i}">停止并禁用 ${esc(o.unit)}</button>`;
    else btn = '<span class="tag">需手动停止</span>';
    if (S.freeing === i) btn = `<span class="muted">${spin}</span>`;
    h += `<div class="check">${badge('bad', I.bad)}<div class="grow">53 端口被占用<div class="s">${what}${(o.addrs || []).length ? ' · ' + esc(o.addrs.join(', ')) : ''}</div></div>${btn}</div>`;
  });
  h += '</div>';
  if (S.freeErr) h += `<div class="alert bad">${I.warn}<div class="grow">${esc(S.freeErr)}</div></div>`;
  return h;
}

function ifRow(i, opts) {
  const sel = opts.selected, multi = opts.multi;
  return `<label class="if${multi ? ' multi' : ''}${sel ? ' sel' : ''}${opts.off ? ' off' : ''}">
    <input type="${multi ? 'checkbox' : 'radio'}" name="${opts.name}" value="${esc(i.name)}" data-bind="${opts.bind}" ${sel ? 'checked' : ''} ${opts.off ? 'disabled' : ''}>
    <span class="tk">${sel ? I.ok : ''}</span>
    <span class="grow"><span>${esc(i.name)}</span><span class="a">${esc(i.addrs.join('  ')) || '无地址'}</span></span>
    ${i.default ? '<span class="tag acc">默认路由</span>' : ''}
  </label>`;
}

function viewNet() {
  const c = S.cfg, ifs = S.state.ifaces;
  const topo = (v, name) => `<label class="topo${c.topology === v ? ' sel' : ''}">
    <input type="radio" name="topology" value="${v}" data-bind="topology" ${c.topology === v ? 'checked' : ''}>
    <span class="art">${ART[v]}</span>
    <span class="nm"><span class="tk">${c.topology === v ? I.ok : ''}</span>${name}</span>
  </label>`;
  let h = head('网络') + '<div class="sec"><div class="lbl">部署方式</div><div class="topos">' + topo('bypass', '单网卡旁路由') + topo('gateway', '双网卡网关') + '</div>' + errOf('topology') + '</div>';
  if (c.topology === 'bypass') {
    h += '<div class="sec"><div class="lbl">网卡</div><div class="ifs">' + ifs.map(i => ifRow(i, { name: 'lan_one', bind: 'lan_one', selected: c.lan[0] === i.name })).join('') + '</div>' + errOf('lan') + '</div>';
    h += `<div class="sec"><label class="agree"><input type="checkbox" data-bind="reply_via" ${c.reply_via ? 'checked' : ''}>回包经主路由</label></div>`;
    if (c.reply_via) h += `<div class="sec short"><label class="lbl" for="router">主路由</label><input class="inp mono${bad('router')}" id="router" type="text" data-bind="router" value="${esc(c.router)}" spellcheck="false" placeholder="例如 192.168.1.1">${errOf('router')}</div>`;
  } else if (c.topology === 'gateway') {
    const sideHead = (cls, icon, name, tag) => `<div class="sh"><span class="ic">${icon}</span><span class="nm">${name}</span><span class="tag">${tag}</span></div>`;
    h += '<div class="g2">';
    h += '<div class="side lan">' + sideHead('lan', I.home, 'LAN 网卡', '内网 · 可多选') + '<div class="ifs">' + ifs.map(i => ifRow(i, { name: 'lan_multi', bind: 'lan_multi', multi: true, selected: c.lan.includes(i.name) })).join('') + '</div>' + errOf('lan') +
      `<div class="rt"><div class="sec"><label class="lbl" for="lan_gateway">LAN 侧网关</label><input class="inp mono${bad('lan_gateway')}" id="lan_gateway" type="text" data-bind="lan_gateway" value="${esc(c.lan_gateway)}" spellcheck="false" placeholder="客户端都在 LAN 网段时留空">${errOf('lan_gateway')}</div>
      <div class="sec"><label class="lbl" for="client_nets">客户端网段</label><textarea class="inp${bad('client_nets')}" id="client_nets" data-bind="client_nets" spellcheck="false" placeholder="每行一个，例如 10.0.0.0/24">${esc(c.client_nets)}</textarea>${errOf('client_nets')}</div></div>` + '</div>';
    h += '<div class="side wan">' + sideHead('wan', I.globe, 'WAN 网卡', '外网 · 单选') + '<div class="ifs">' + ifs.map(i => ifRow(i, { name: 'wan', bind: 'wan', selected: c.wan === i.name })).join('') + '</div>' + errOf('wan') + '</div>';
    h += '</div>';
    h += `<div class="alert">${I.warn}<div class="grow"><div>主路由需要把 FakeIP 网段和要代理的网段转到这台机器：从 LAN 网卡进来的 TCP、UDP 全部进入 sing-box，其余（如 ping）转发并 NAT 到 WAN。</div>
      <label class="agree"><input type="checkbox" data-bind="accept_gateway" ${c.accept_gateway ? 'checked' : ''}>我知道，继续</label>${errOf('accept_gateway')}</div></div>`;
  }
  h += `<div class="sec short"><label class="lbl" for="panel_port">面板端口</label><input class="inp${bad('panel_port')}" id="panel_port" type="number" min="1" max="65535" data-bind="panel_port" value="${esc(c.panel_port)}">${errOf('panel_port')}</div>`;
  h += `<div class="g2">
    <div class="sec"><label class="lbl" for="panel_user">面板用户名 <span class="tag">可选</span></label><input class="inp${bad('panel_user')}" id="panel_user" type="text" data-bind="panel_user" value="${esc(c.panel_user)}" autocomplete="off" spellcheck="false" placeholder="${S.state.has_data ? '留空不修改' : '留空则面板不需要登录'}">${errOf('panel_user')}</div>
    <div class="sec"><label class="lbl" for="panel_password">面板密码</label><input class="inp${bad('panel_password')}" id="panel_password" type="password" data-bind="panel_password" value="${esc(c.panel_password)}" autocomplete="new-password">${errOf('panel_password')}</div>
  </div>`;
  return h;
}

function viewDNS() {
  const c = S.cfg;
  return head('DNS 上游') + `<div class="g2">
    <div class="sec"><label class="lbl" for="domestic">国内</label><textarea class="inp${bad('domestic')}" id="domestic" data-bind="domestic" spellcheck="false" placeholder="地址 [拨号 IP]">${esc(c.domestic)}</textarea>${errOf('domestic')}</div>
    <div class="sec"><label class="lbl" for="foreign">国外</label><textarea class="inp${bad('foreign')}" id="foreign" data-bind="foreign" spellcheck="false" placeholder="地址 [拨号 IP]">${esc(c.foreign)}</textarea>${errOf('foreign')}</div>
  </div>`;
}

function viewSB() {
  const c = S.cfg;
  return head('代理') + `<div class="g2">
    <div class="sec"><label class="lbl" for="fakeip_range">FakeIP 网段</label><input class="inp mono${bad('fakeip_range')}" id="fakeip_range" type="text" data-bind="fakeip_range" value="${esc(c.fakeip_range)}" spellcheck="false">${errOf('fakeip_range')}</div>
    <div class="sec"><label class="lbl" for="mixed_port">mixed 代理端口</label><input class="inp${bad('mixed_port')}" id="mixed_port" type="number" min="1" max="65535" data-bind="mixed_port" value="${esc(c.mixed_port)}">${errOf('mixed_port')}</div>
  </div>
  <div class="sec"><label class="lbl" for="nodes">节点 <span class="tag">可选</span></label><textarea class="inp" id="nodes" data-bind="nodes" spellcheck="false" placeholder="分享链接（每行一个）、Clash YAML 或 sing-box JSON" style="min-height:180px">${esc(c.nodes)}</textarea></div>`;
}

function lines(s) { return s.split('\n').map(x => x.trim()).filter(x => x && !x.startsWith('#')).length; }

function viewConfirm() {
  const c = S.cfg, gw = c.topology === 'gateway';
  const tile = (k, v, s, wide) => `<div class="tile${wide ? ' wide' : ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  let h = head('确认') + '<div class="tiles">';
  h += tile('部署方式', gw ? '双网卡网关' : '单网卡旁路由', gw ? `<span class="chip">LAN ${esc(c.lan.join(', '))}</span> <span class="chip wan">WAN ${esc(c.wan)}</span>` : esc(c.lan[0] || ''));
  h += tile('面板端口', esc(c.panel_port));
  h += tile('面板登录', c.panel_user.trim() ? `用户名 <span class="mono">${esc(c.panel_user.trim())}</span>` : (S.state.has_data ? '不修改' : '不需要登录'));
  if (gw) {
    const nets = c.client_nets.split('\n').map(x => x.trim()).filter(Boolean);
    h += tile('回程路由', nets.length ? `<span class="mono">${esc(nets.join(', '))}</span>` : '不需要', nets.length ? `经 LAN 侧网关 <span class="mono">${esc(c.lan_gateway)}</span>` : '客户端都在 LAN 网段', true);
  } else {
    h += tile('回包', c.reply_via ? `经主路由 <span class="mono">${esc(c.router)}</span>` : '直接发给客户端', '', true);
  }
  if (S.state.has_data) {
    h += tile('设置', '沿用已有数据', '', true);
  } else {
    h += tile('国内上游', `${lines(c.domestic)} 个`);
    h += tile('国外上游', `${lines(c.foreign)} 个`);
    h += tile('FakeIP 网段', `<span class="mono">${esc(c.fakeip_range)}</span>`);
    h += tile('mixed 端口', esc(c.mixed_port));
    h += tile('节点', c.nodes.trim() ? '安装时导入' : '稍后在面板添加', '', true);
  }
  return h + '</div>';
}

function jobBar(j) {
  const list = j ? j.steps : [];
  const n = list.filter(s => s.status === 'ok').length, run = list.some(s => s.status === 'running') ? .5 : 0;
  const pct = list.length ? Math.round((n + run) / list.length * 100) : 4;
  const cls = j && j.done ? (j.ok ? ' ok' : ' fail') : '';
  return `<div class="bar${cls}"><i style="width:${Math.max(4, pct)}%"></i></div>`;
}

function viewProgress() {
  const j = S.job, failed = j && j.done && !j.ok;
  let h = `<div class="head"><div class="k">${failed ? '安装失败' : '正在安装'}</div><h1>${failed ? '没有装完' : '安装中'}</h1></div>` + jobBar(j);
  h += '<ol class="timeline">';
  (j ? j.steps : []).forEach(s => {
    const b = s.status === 'ok' ? badge('ok', I.ok) : s.status === 'fail' ? badge('bad', I.bad) : s.status === 'running' ? badge('run', spin) : badge('wait', I.dot);
    h += `<li class="${esc(s.status)}">${b}<span class="t">${esc(s.name)}</span></li>`;
  });
  h += '</ol>';
  if (j && j.error) h += `<div class="alert bad">${I.warn}<div class="grow">${esc(j.error)}</div></div>`;
  if (j && j.warnings && j.warnings.length) h += `<div class="alert">${I.warn}<div class="grow warnlist">${j.warnings.map(w => `<div>${esc(w)}</div>`).join('')}</div></div>`;
  h += `<details class="log" id="logbox" ${S.logOpen || failed ? 'open' : ''}><summary>${I.chev}日志 · ${S.log.length} 行</summary><pre class="out" id="log">${esc(S.log.join('\n'))}</pre></details>`;
  return h;
}

function valChip(v) { return `<span class="val">${esc(v)}<button type="button" data-act="copy" data-v="${esc(v)}" aria-label="复制">${I.copy}</button></span>`; }

function viewDone() {
  const h0 = S.job.hints, ip = h0.lan_ip, port = S.job.panel_port;
  // a gateway's panel is closed on the WAN: send the browser to the LAN address
  const host = h0.topology === 'gateway' && ip ? ip : location.hostname;
  const url = `http://${host}${port === 80 ? '' : ':' + port}/`;
  S.panelURL = url;
  let h = `<div class="hero"><div class="big">${I.ok}</div><h1>安装完成</h1><div class="url">${esc(url)}</div></div>`;
  h += '<div class="sec"><div class="lbl">接下来</div><div class="todo">';
  const item = (n, body) => `<div class="check"><span class="n">${n}</span><div class="grow">${body}</div></div>`;
  h += item(1, `主路由添加静态路由 ${valChip(h0.fakeip_range)} → ${valChip(ip)}`);
  h += item(2, `客户端的 DNS 设置为 ${valChip(ip)}`);
  h += '</div></div>';
  const w = S.job.warnings || [];
  if (w.length) h += `<div class="alert">${I.warn}<div class="grow warnlist">${w.map(x => `<div>${esc(x)}</div>`).join('')}</div></div>`;
  return h;
}

function viewInstalled() {
  const i = S.state.installed, url = `http://${location.hostname}${i.panel_port === 80 ? '' : ':' + i.panel_port}/`;
  return `<div class="hero"><div class="big">${I.ok}</div><h1>已安装</h1><div class="url">版本 ${esc(i.version)} · ${esc(url)}</div></div>`;
}

function rail(list, cur) {
  const items = list ? list.map((x, i) => {
    const st = cur === 'all' || i < cur ? 'done' : i === cur ? 'on' : '';
    return `<li class="${st}"><span class="dot">${st === 'done' ? I.ok : i + 1}</span><span class="t">${esc(x.name)}</span></li>`;
  }).join('') : '';
  return `<aside class="rail"><div class="brand"><span class="logo">${I.logo}</span><div><div class="n">atom</div><div class="v">安装向导 · ${esc(S.state.version)}</div></div></div>
    <ol class="steps">${items}</ol>
    <div class="foot">${S.state.system.hostname ? `<span>${esc(S.state.system.hostname)}</span>` : ''}<span>${esc(S.state.system.os || '')}</span></div></aside>`;
}

function mbar(pct) {
  return `<div class="mbar"><div class="brand"><span class="logo">${I.logo}</span><div><div class="n">atom</div><div class="v">${esc(S.state.version)}</div></div></div><span class="sp"></span>${pct === null ? '' : `<div class="bar"><i style="width:${pct}%"></i></div>`}</div>`;
}

function render() {
  const st = S.state;
  const app = document.getElementById('app');
  const keepLog = document.getElementById('logbox');
  if (keepLog) S.logOpen = keepLog.open;
  let left, content, nav = '', pct = null;
  const runSteps = () => steps().concat([{ name: '安装' }]);
  if (st.installed && S.phase === 'wizard') {
    left = rail(null);
    content = viewInstalled();
    const url = `http://${location.hostname}${st.installed.panel_port === 80 ? '' : ':' + st.installed.panel_port}/`;
    nav = `<span class="sp"></span><a class="btn pri lg" href="${esc(url)}">进入面板 ${I.right}</a>`;
  } else if (S.phase === 'wizard') {
    const list = steps(), last = S.step === list.length - 1;
    left = rail(list, S.step);
    content = list[S.step].view();
    pct = Math.round((S.step + 1) / list.length * 100);
    nav = `<button class="btn ghost" data-act="prev" ${S.step === 0 ? 'disabled' : ''}>${I.left}上一步</button><span class="sp"></span>` +
      (last ? `<button class="btn pri lg" data-act="install">开始安装</button>` : `<button class="btn pri lg" data-act="next" ${S.step === 0 && !envReady() ? 'disabled' : ''}>下一步 ${I.right}</button>`);
  } else if (S.phase === 'progress') {
    const j = S.job, list = runSteps();
    left = rail(list, list.length - 1);
    content = viewProgress();
    if (j && j.done && !j.ok) nav = `<button class="btn ghost" data-act="back">${I.left}返回修改</button><span class="sp"></span><button class="btn pri lg" data-act="retry">重试</button>`;
  } else {
    left = rail(runSteps(), 'all');
    content = viewDone();
    nav = `<span class="count" id="countdown"></span><span class="sp"></span><button class="btn ghost" data-act="pause" id="pausebtn">${S.paused ? '继续跳转' : '暂停跳转'}</button><button class="btn pri lg" data-act="open">进入面板 ${I.right}</button>`;
  }
  app.innerHTML = left + `<section class="body">${mbar(pct)}<div class="content">${content}</div>${nav ? `<div class="navbar">${nav}</div>` : ''}</section>`;
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
}

async function validate(id) {
  const r = await api('POST', '/api/validate', S.cfg);
  S.errors = {};
  r.errors.forEach(e => { if (id === undefined || FIELD_STEP[e.field] === id) S.errors[e.field] = e.msg; });
  return r.errors;
}

async function next() {
  if (stepId() !== 'env') {
    const errs = await validate(stepId());
    if (errs.some(e => FIELD_STEP[e.field] === stepId())) { render(); return; }
  }
  S.errors = {};
  S.step++;
  render();
}

async function install() {
  const errs = await validate();
  if (errs.length) {
    const ids = steps().map(x => x.id);
    S.step = Math.min(...errs.map(e => Math.max(0, ids.indexOf(FIELD_STEP[e.field] || 'net'))));
    render();
    return;
  }
  try { await api('POST', '/api/install', S.cfg); } catch (e) {
    if (e.data && e.data.errors) { e.data.errors.forEach(x => S.errors[x.field] = x.msg); S.step = 1; render(); return; }
    alert(e.message); return;
  }
  startProgress();
}

function startProgress() {
  S.phase = 'progress'; S.job = null; S.log = []; S.jobNext = 0; S.logOpen = false;
  render();
  pollJob();
}

async function pollJob() {
  try {
    const j = await api('GET', '/api/job?since=' + S.jobNext);
    if (!j.idle) {
      S.job = Object.assign(S.job || {}, j);
      S.job.steps = j.steps;
      S.log = S.log.concat(j.log || []);
      S.jobNext = j.next;
      if (j.done && j.ok) { S.phase = 'done'; render(); watchPanel(); return; }
      render();
      if (j.done) return;
    }
  } catch (e) { /* the server may be busy; try again */ }
  setTimeout(pollJob, 700);
}

// The panel answers on its own port once atomdns is up (it already is); count down, then go.
function watchPanel() {
  let left = 10;
  const tick = () => {
    const el = document.getElementById('countdown');
    if (S.paused) { if (el) el.textContent = ''; return; }
    if (el) el.textContent = left + ' 秒后进入面板';
    if (left-- <= 0) { openPanel(); return; }
    S.redirectTimer = setTimeout(tick, 1000);
  };
  tick();
}

async function openPanel() {
  clearTimeout(S.redirectTimer);
  try { await api('POST', '/api/finish'); } catch (e) {}
  for (let i = 0; i < 20; i++) {
    try { await fetch(S.panelURL, { mode: 'no-cors', cache: 'no-store' }); break; } catch (e) { await new Promise(r => setTimeout(r, 500)); }
  }
  location.href = S.panelURL;
}

async function free(i) {
  const o = S.state.port53[i];
  S.freeing = i; S.freeErr = ''; render();
  try {
    S.state = await api('POST', '/api/free', { kind: o.kind, unit: o.unit });
    S.freed.push(o.kind === 'resolved' ? '已停用 systemd-resolved 的 DNS 监听' : '已停止并禁用 ' + o.unit);
  } catch (e) { S.freeErr = e.message; }
  S.freeing = null; render();
}

// The wizard is plain http on a LAN address, where navigator.clipboard is not available.
function copy(text, btn) {
  const done = () => { btn.innerHTML = I.ok; setTimeout(() => { btn.innerHTML = I.copy; }, 1200); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => {}); return; }
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  t.remove();
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') next();
  else if (a === 'prev') { S.errors = {}; S.step--; render(); }
  else if (a === 'install') install();
  else if (a === 'free') free(+b.dataset.i);
  else if (a === 'back') { S.phase = 'wizard'; S.step = steps().length - 1; render(); }
  else if (a === 'retry') install();
  else if (a === 'open') openPanel();
  else if (a === 'copy') copy(b.dataset.v, b);
  else if (a === 'pause') { S.paused = !S.paused; b.textContent = S.paused ? '继续跳转' : '暂停跳转'; if (!S.paused) watchPanel(); else clearTimeout(S.redirectTimer); const el = document.getElementById('countdown'); if (el && S.paused) el.textContent = ''; }
});

document.addEventListener('input', ev => bind(ev.target));
document.addEventListener('change', ev => {
  bind(ev.target);
  const f = ev.target.dataset && ev.target.dataset.bind;
  if (['topology', 'lan_one', 'lan_multi', 'wan', 'accept_gateway', 'reply_via'].includes(f)) {
    render();
    const again = document.querySelector(`[data-bind="${f}"][value="${CSS.escape(ev.target.value)}"]`) || document.querySelector(`[data-bind="${f}"]`);
    if (again) again.focus();
  }
});

function bind(t) {
  const f = t.dataset && t.dataset.bind;
  if (!f) return;
  const c = S.cfg;
  if (f === 'lan_gateway' || f === 'client_nets') { c[f] = t.value; S.routesEdited = true; return; }
  if (f === 'lan_one') c.lan = [t.value];
  else if (f === 'lan_multi') { c.lan = [...document.querySelectorAll('[data-bind=lan_multi]:checked')].map(x => x.value); if (c.lan.includes(c.wan)) c.wan = ''; }
  else if (f === 'wan') { c.wan = t.value; c.lan = c.lan.filter(x => x !== c.wan); }
  else if (f === 'accept_gateway') c.accept_gateway = t.checked;
  else if (f === 'reply_via') { c.reply_via = t.checked; if (c.reply_via && !c.router) c.router = (S.state.gateways || {})[c.lan[0]] || ''; }
  else if (f === 'topology') {
    c.topology = t.value;
    const ifs = S.state.ifaces, def = ifs.find(i => i.default);
    if (t.value === 'gateway' && !c.wan && def) {
      // the default route usually leaves through the WAN side
      c.wan = def.name;
      const rest = ifs.filter(i => i.name !== def.name);
      c.lan = rest.length ? [rest[0].name] : [];
    } else if (t.value === 'gateway') c.lan = c.lan.filter(x => x !== c.wan).slice(0, 1);
    else if (t.value === 'bypass') c.lan = [(def || ifs[0] || { name: '' }).name].filter(Boolean);
  }
  else if (f === 'panel_port' || f === 'mixed_port') c[f] = parseInt(t.value, 10) || 0;
  else c[f] = t.value;
  if (['topology', 'lan_multi', 'wan'].includes(f)) prefillRoutes();
}

// The LAN-side gateway and the client networks come from the routes the machine already has through a LAN
// interface, until the user types into them.
function prefillRoutes() {
  const c = S.cfg;
  if (S.routesEdited || c.topology !== 'gateway') return;
  const rs = (S.state.routes || []).filter(r => c.lan.includes(r.dev));
  c.lan_gateway = rs.length ? rs[0].via : '';
  c.client_nets = rs.filter(r => r.via === c.lan_gateway).map(r => r.net).join('\n');
}

(async function () {
  try {
    await loadState();
    const j = await api('GET', '/api/job?since=0');
    if (!j.idle) { S.phase = 'progress'; S.job = j; S.log = j.log; S.jobNext = j.next; render(); if (j.done && j.ok) { S.phase = 'done'; render(); watchPanel(); } else if (!j.done) pollJob(); else render(); return; }
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<section class="body"><div class="content"><div class="alert bad">${I.warn}<div class="grow">${esc(e.message)}</div></div></div></section>`;
  }
})();
</script>
